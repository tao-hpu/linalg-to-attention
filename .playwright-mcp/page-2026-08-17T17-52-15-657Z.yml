            - text: 掩码不引入任何参数，也不改变形状：进去 (n×n)，出来还是 (n×n)。 它只是把注意力的候选集合从「整句」削成「自己和前文」， 所以
            - link "第 10 节" [ref=f13e367] [cursor=pointer]:
