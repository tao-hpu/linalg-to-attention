server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带 hash，可长期缓存
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退：深链接（如 /ch/dot-product）优先命中预渲染的
    # /ch/<slug>/index.html（直接返回、不做补斜杠的 301，保持无斜杠 canonical），
    # 否则回退到 /index.html 交给前端路由。
    #
    # 缓存头必须加在这里，不能单独开一个 `location = /index.html`：
    # 一是精确匹配只覆盖根页面，38 个预渲染的 /ch/<slug>/index.html 全漏掉；
    # 二是 try_files 命中文件后不会重走 location 匹配，请求始终留在本块里，
    # 另开的 location 根本不会生效。上面的正则块已经吃掉了全部带 hash 的静态资源，
    # 落到这里的只剩 HTML 和 robots/sitemap，一律不缓存最省心。
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
